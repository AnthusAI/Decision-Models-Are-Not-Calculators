[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "benford-decisions"
version = "0.1.0"
description = "Reproducible option-order tests for fast decision models"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Anthus AI Solutions" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
charts = ["matplotlib==3.11.2", "Pillow==12.3.0"]
jev = ["typesafe-sdk==0.7.1"]
laya = ["laya==0.3.20"]

[project.scripts]
benford-decisions = "benford_decisions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
